name: Build Kasir Nominal V6.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and locate Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/KasirNominal_V6_Source.zip"
          EXTRACT_DIR="$RUNNER_TEMP/kasir-nominal-v6-src"
          mkdir -p "$EXTRACT_DIR"
          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP sumber tidak ditemukan: $ZIP"
            exit 1
          fi
          unzip -oq "$ZIP" -d "$EXTRACT_DIR"

          echo "Mencari settings.gradle..."
          SETTINGS="$(find "$EXTRACT_DIR" -type f -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find "$EXTRACT_DIR" -type f -name settings.gradle.kts -print -quit)"
          fi
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle atau settings.gradle.kts tidak ditemukan di ZIP."
            find "$EXTRACT_DIR" -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Folder Gradle ditemukan tetapi app/build.gradle tidak ada: $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build V6 APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload V6 APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirNominal-V6-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
