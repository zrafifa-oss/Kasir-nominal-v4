name: Build Kasir Nominal V5.2 From Source ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract V5.2 source project
        run: |
          test -f KasirNominal_V5_2_Source.zip
          unzip -o KasirNominal_V5_2_Source.zip -d .
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build V5.2 APK
        run: gradle --no-daemon assembleDebug
      - name: Upload V5.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirNominal-V5.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
