
name: Build Kasir Nominal V6.4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract V6.4 source
        run: |
          unzip -q KasirNominal_V6_4_QRIS_Kecil.zip -d source
          PROJECT_DIR=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Prepare APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name '*.apk' -path '*/outputs/apk/debug/*' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/KasirNominal-V6.4.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kasir-Nominal-V6.4
          path: KasirNominal-V6.4.apk
          
