name: Build Kasir Nominal V6.1 From Source ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V6 source project
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          test -f KasirNominal_V6_Source.zip
          unzip -o KasirNominal_V6_Source.zip -d "$GITHUB_WORKSPACE"
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/settings.gradle" -o -f "$GITHUB_WORKSPACE/settings.gradle.kts"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build V6 APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          test -f settings.gradle -o -f settings.gradle.kts
          gradle --no-daemon assembleDebug

      - name: Upload V6 APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirNominal-V6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
